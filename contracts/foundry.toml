[profile.default]
src     = "src"
out     = "out"
libs    = ["lib"]
solc    = "0.8.20"

# Enable the optimizer — 200 runs is the standard trade-off:
# higher runs = cheaper calls but larger bytecode deployment cost.
# For a read-heavy contract like this, 500–1000 would be fine too.
optimizer        = true
optimizer_runs   = 200

# Remappings for forge-std (installed via `forge install foundry-rs/forge-std`)
remappings = [
    "forge-std/=lib/forge-std/src/"
]

# Sepolia testnet config — used by `forge script --rpc-url sepolia`
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

# Etherscan / Sourcify verification
[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = "sepolia" }

[fmt]
line_length    = 100
tab_width      = 4
quote_style    = "double"
